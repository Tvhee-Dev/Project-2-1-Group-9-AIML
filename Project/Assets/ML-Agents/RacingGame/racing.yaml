behaviors:
  RacingAgent:
    trainer_type: ppo

    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.003
      beta_schedule: linear
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.9995

    max_steps: 2500000
    time_horizon: 256
    summary_freq: 10000

environment_parameters:
  # Track
  checkpoint_count: 51

  # Car handling
  max_speed: 45
  acceleration: 20
  brake_strength: 30
  steering_strength: 75
  high_speed_steering_factor: 0.25
  minimum_forward_speed: 0
  sideways_grip: 5

  # Wall rays
  wall_ray_count: 15
  wall_ray_fov: 180
  wall_ray_side_distance: 12
  wall_ray_center_distance: 70
  wall_ray_center_power: 1.5
  wall_ray_angle_power: 1.5
  wall_ray_forward_offset: 1.2
  wall_ray_height: 0

  # Wall penalties
  wall_penalty_per_second: 0.05
  max_wall_contact_seconds: 0.75
  prolonged_wall_penalty: -1
  wall_impact_penalty: 0.1

  # Progress rewards
  checkpoint_reward_per_lap: 1
  target_progress_reward_scale: 0.01
  forward_progress_reward_per_second: 0.02

  # Driving quality
  time_penalty_per_second: 0.05
  excessive_yaw_penalty_per_second: 0.01
  slip_penalty_per_second: 0.005
  allowed_yaw_rate: 2.2
  allowed_slip_angle: 30
  maximum_slip_angle: 75

  # Lap-time reward
  target_lap_time: 46
  lap_time_reward_at_target: 6
  lap_time_reward_scale: 3

  # Decision requester
  decision_period: 2
  take_actions_between_decisions: 1